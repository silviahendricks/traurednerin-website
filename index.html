<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Silvia Hendricks - Traurednerin</title>
  <style>
    body {
      margin: 0;
      font-family: Raleway, Arial, sans-serif;
      background-color: #faf9f6;
      color: #545454;
      line-height: 1.8;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 70px 24px;
    }
    .hero {
      margin-bottom: 36px;
    }
    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }
    h1 {
      font-size: 3.2rem;
      margin-top: 0;
      margin-bottom: 18px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #294035;
      line-height: 1.15;
    }
    h2 {
      margin-top: 56px;
      font-size: 1.4rem;
      font-weight: 500;
      color: #294035;
    }
    .intro {
      font-size: 1.15rem;
      margin-top: 0;
      margin-bottom: 34px;
      color: #545454;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    p {
      margin-bottom: 20px;
      font-size: 1.05rem;
    }
    .contact {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid #d9d4cc;
    }

    /* --- Bild-Text-Abschnitte --- */
    .section-with-image {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-top: 20px;
    }
    .section-with-image .text-col {
      flex: 1.2;
    }
    .section-with-image .image-col {
      flex: 1;
    }
    .section-with-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }
